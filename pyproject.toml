[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "json-schema-doctor"
version = "0.1.0"
description = "A high-speed CLI and library for detecting schema drifts, formatting JSON/YAML, and generating automatic JSON schemas from sample payloads."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "slopggobblercobbler81" }
]
keywords = [
    "json-schema",
    "schema-drift",
    "json",
    "yaml",
    "schema-generator",
    "validator",
    "doctor",
    "linter"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities"
]
dependencies = [
    "jsonschema>=4.0.0",
    "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
json-schema-doctor = "json_schema_doctor.cli:main"
jsd = "json_schema_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/slopggobblercobbler81/json-schema-doctor"
Repository = "https://github.com/slopggobblercobbler81/json-schema-doctor"
Issues = "https://github.com/slopggobblercobbler81/json-schema-doctor/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.setuptools.packages.find]
where = ["."]
include = ["json_schema_doctor*"]
