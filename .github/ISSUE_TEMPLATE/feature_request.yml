name: "💡 Feature Request"
description: Suggest an idea or enhancement for this repository
title: "[Feature]: "
labels: ["scope: core-engine"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide details about your feature proposal.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: What is your preferred solution or improvement?
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Community Alignment
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
