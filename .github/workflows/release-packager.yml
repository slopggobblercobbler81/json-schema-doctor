name: Release Asset Packager

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Asset build type (both, wheel, sdist)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - wheel
          - sdist
      create_checksums:
        description: 'Generate SHA-256 checksums for release assets'
        required: false
        default: true
        type: boolean
      artifact_retention_days:
        description: 'Artifact retention days'
        required: false
        default: 7
        type: number

jobs:
  package:
    name: Package Release Assets & Upload
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip build wheel setuptools

      - name: Build distributions
        run: |
          BUILD_TYPE="${{ inputs.build_type || 'both' }}"
          echo "Building distribution package(s) with mode: $BUILD_TYPE"
          if [ "$BUILD_TYPE" = "wheel" ]; then
            python -m build --wheel
          elif [ "$BUILD_TYPE" = "sdist" ]; then
            python -m build --sdist
          else
            python -m build
          fi
          ls -la dist/

      - name: Generate SHA-256 Checksums
        if: ${{ inputs.create_checksums != false }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          retention-days: ${{ inputs.artifact_retention_days || 7 }}
          if-no-files-found: error
